
[build.environment]
  NPM_VERSION = "11"

# Catch-all request/response body logger. Declared here (not inline) so it runs
# before the file-based `proxy` edge function and wraps every interaction.
# Active only when MCP_VERBOSE_LOGGING is set.
# [[edge_functions]]
#   function = "request-logger"
#   path = "/*"

[[edge_functions]]
  function = "proxy"
  path = "/proxy/:token/*"

[[redirects]]
  from = "/mcp/*"
  to = ".netlify/functions/mcp/:splat"
  status = 200

# The OAuth server declares its own paths (netlify/functions/oauth-server.ts).

# Domain ownership proof for the OpenAI apps/plugin directory. The file is a
# static asset at the repo root (this site publishes the root, so no build step
# is involved); this header only pins its Content-Type, since the token file has
# no extension and would otherwise be served as a generic binary download.
[[headers]]
  for = "/.well-known/openai-apps-challenge"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300"
