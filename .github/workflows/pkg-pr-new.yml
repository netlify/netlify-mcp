name: Publish preview package

# Publishes a continuous-release preview build of this package via pkg.pr.new
# on every push and pull request. pkg.pr.new packs the build output and
# uploads it to its own CDN (nothing is published to npm), then the pkg.pr.new
# GitHub App comments on the pull request with the exact install command,
# e.g. `npm i https://pkg.pr.new/netlify/netlify-mcp@<pr-number>`.
# See https://github.com/stackblitz-labs/pkg.pr.new
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # setup-node v7 auto-detects the package manager and enables its
          # own caching (`package-manager-cache`) by default, which runs
          # `npm config get cache` using the npm bundled with Node 24
          # before we get a chance to install the pinned npm below. This
          # package declares `devEngines.packageManager.npm: ">=11.19.1"`
          # with `onFail: "warn"`, but we still want CI to run against the
          # exact pinned version rather than whatever Node 24 happens to
          # bundle. Disable setup-node's caching to avoid running any npm
          # command ahead of the explicit npm install below.
          package-manager-cache: false

      # Node 24 bundles an older npm 11.x, but this package declares
      # `devEngines.packageManager.npm: ">=11.19.1"`, so install the latest
      # npm 11.x explicitly.
      - name: Install npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish preview package
        run: npm exec pkg-pr-new publish
