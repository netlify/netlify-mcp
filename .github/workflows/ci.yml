name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, build & test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Node 24 still bundles npm 11.x, but this package declares
      # `devEngines.packageManager.npm: ">=12.0.0"` with `onFail: "error"`,
      # so install npm 12 explicitly. (No built-in `cache: npm` above: that
      # option runs an `npm config get cache` check via setup-node before
      # this step, using the bundled npm 11.x, which devEngines' `onFail:
      # "error"` would reject.)
      - name: Install npm 12
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
